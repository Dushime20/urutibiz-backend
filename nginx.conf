user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;

    # -------------------------------------------------------------------------
    # Buffer sizes
    # -------------------------------------------------------------------------
    client_body_buffer_size     128k;
    client_max_body_size        50M;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 16k;

    # -------------------------------------------------------------------------
    # Timeouts
    # -------------------------------------------------------------------------
    client_body_timeout   30;
    client_header_timeout 30;
    send_timeout          30;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Rate limiting zones
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=100r/m;
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=general_limit:10m rate=200r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Upstream — use the Docker Compose container_name so Docker DNS resolves it
    # The resolver points to Docker's internal DNS server at 127.0.0.11
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream backend {
        server urutibiz-api:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Main server block — HTTP on port 8081
    # -------------------------------------------------------------------------
    server {
        listen      8081;
        # listen      [::]:8081; # Commented out to prevent crashes on hosts without IPv6
        server_name _;

        # Security headers — safe to set at server level
        add_header X-Frame-Options         "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options  "nosniff"                       always;
        add_header X-XSS-Protection        "1; mode=block"                 always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        # Connection limits
        limit_conn conn_limit 20;

        # ------------------------------------------------------------------
        # Health check — no rate limiting, no access log
        # ------------------------------------------------------------------
        location = /api/v1/health {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            access_log off;
        }

        # ------------------------------------------------------------------
        # Auth endpoints — strict rate limiting
        # ------------------------------------------------------------------
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_hide_header  X-Powered-By;
            proxy_buffering    off;
        }

        # ------------------------------------------------------------------
        # All other API routes
        # ------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_hide_header  X-Powered-By;

            proxy_buffering        on;
            proxy_buffer_size      8k;
            proxy_buffers          8 8k;
            proxy_busy_buffers_size 16k;
        }

        # ------------------------------------------------------------------
        # WebSocket (Socket.IO)
        # ------------------------------------------------------------------
        location /socket.io/ {
            limit_req zone=general_limit burst=100 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket requires long timeouts
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_buffering     off;
        }

        # ------------------------------------------------------------------
        # Static assets proxied from backend (uploads, etc.)
        # ------------------------------------------------------------------
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            expires            1y;
            add_header         Cache-Control "public, immutable";
            access_log         off;
        }

        # ------------------------------------------------------------------
        # Catch-all — proxy everything else to backend
        # ------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=100 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_hide_header  X-Powered-By;
        }

        # ------------------------------------------------------------------
        # Block hidden files (.git, .env, etc.)
        # ------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log    off;
            log_not_found off;
        }

        # ------------------------------------------------------------------
        # Error pages
        # ------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
