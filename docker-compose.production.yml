version: '3.8'

services:
  # PostgreSQL Database with PostGIS and pgvector
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: urutibiz-postgres:latest
    container_name: urutibiz-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-urutibiz_db}
      POSTGRES_USER: ${DB_USER:-urutibiz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - urutibiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-urutibiz_user} -d ${DB_NAME:-urutibiz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: urutibiz-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - urutibiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: urutibiz-nginx
    ports:
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - urutibiz-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database Migration (runs once before API)
  migration:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    image: urutibiz-migration:latest
    container_name: urutibiz-migration
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-urutibiz_db}
      DB_USER: ${DB_USER:-urutibiz_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urutibiz-network
    restart: "no"

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: urutibiz-backend:latest
    container_name: urutibiz-api
    environment:
      # Application
      NODE_ENV: production
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      
      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-urutibiz_db}
      DB_USER: ${DB_USER:-urutibiz_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      
      # Security
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      FROM_EMAIL: ${FROM_EMAIL}
      FROM_NAME: ${FROM_NAME}
      
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      
      # Firebase - Using file mount instead of env var
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-firebase}
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-credentials.json
      
      # AI Services
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      
      # Python Service
      PYTHON_IMAGE_SERVICE_URL: http://python-service:8001
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Temporarily removed python-service dependency to isolate startup issues
      # python-service:
      #   condition: service_healthy
    
    restart: unless-stopped
    
    networks:
      - urutibiz-network
    
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Python AI Service for Image Embeddings
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    image: urutibiz-python-service:latest
    container_name: urutibiz-python-service
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/.cache/huggingface
    ports:
      - "8001:8001"
    volumes:
      - python-model-cache:/app/.cache/huggingface
    restart: unless-stopped
    networks:
      - urutibiz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  python-model-cache:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  urutibiz-network:
    driver: bridge
