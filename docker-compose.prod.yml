services:
  # Database Service (with PostGIS and pgvector)
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: urutibiz-postgres:latest
    container_name: urutibiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-urutibiz_db}
      POSTGRES_USER: ${DB_USER:-urutibiz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-urutibiz_user} -d ${DB_NAME:-urutibiz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - urutibiz-network

  # Cache Service
  redis:
    image: redis:7-alpine
    container_name: urutibiz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urutibiz-network

  # Database Migration (runs once before API)
  migration:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    image: urutibiz-migration:latest
    container_name: urutibiz-migration
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-urutibiz_db}
      DB_USER: ${DB_USER:-urutibiz_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urutibiz-network
    restart: "no"

  # Python Image Service
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    image: urutibiz-python-service:latest
    container_name: urutibiz-python-service
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - python-model-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - urutibiz-network

  # Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: urutibiz-backend:latest
    container_name: urutibiz-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-urutibiz_db}
      - DB_USER=${DB_USER:-urutibiz_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - PYTHON_IMAGE_SERVICE_URL=http://python-service:8001
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - urutibiz-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: urutibiz-nginx
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - urutibiz-network

volumes:
  postgres_data:
  redis_data:
  python-model-cache:
  uploads_data:
  logs_data:

networks:
  urutibiz-network:
    driver: bridge

