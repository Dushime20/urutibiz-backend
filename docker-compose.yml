services:
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: urutibiz-python-service
    ports:
      - "8001:8001"
    networks:
      - urutibiz-network
    volumes:
      # Persist HuggingFace model cache
      - python-model-cache:/app/.cache/huggingface
    environment:
      - HF_HOME=/app/.cache/huggingface
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    build:
      context: ./docker
      dockerfile: postgres-pgvector.Dockerfile
    image: urutibiz-postgres-pgvector:dev
    container_name: urutibiz-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-urutibiz_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-urutibiz_dev}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - urutibiz-network

  redis:
    image: redis:7-alpine
    container_name: urutibiz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - urutibiz-network

  nginx:
    image: nginx:alpine
    container_name: urutibiz-nginx
    ports:
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - urutibiz-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:4.8.1
    container_name: urutibiz-adminer
    ports:
      - "8082:8080"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - urutibiz-network

  migration:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: urutibiz-migration
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-urutibiz_dev}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urutibiz-network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: urutibiz-api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-urutibiz_dev}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_IMAGE_SERVICE_URL=http://python-service:8001
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - PUSH_PROVIDER=${PUSH_PROVIDER:-firebase}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - API_PREFIX=${API_PREFIX:-/api/v1}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-8}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      python-service:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - urutibiz-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  python-model-cache:

networks:
  urutibiz-network:
    driver: bridge
